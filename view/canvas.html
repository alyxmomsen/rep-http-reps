<script>
    window.addEventListener("DOMContentLoaded"  , () => {

        const canvas = document.getElementById('canvas');

        if(canvas === null || canvas instanceof HTMLCanvasElement === false) {
            return ;
        }

        const keys = {};

        window.addEventListener("keydown" , (e) => {

            keys[e.key] = true ;

        });

        window.addEventListener("keyup" , (e) => {

            keys[e.key] = false ;

        });

        const ctx = canvas.getContext("2d");

        

        let timeoutid = Infinity ;
        let deltax = 0 ;
        let deltay = 0 ;

        const pos = {
            x:0 , 
            y:0 ,
        }

        const maxDelta = 3 ;
        const deltastepabs = 0.2 ;
        const deltaDemph = 1.02 ;

        const athmosphere = {
            x:0.0 , 
            y:0.1 ,
        }


        const elems = [] ;

        const update = () => {

            const random = Math.floor(Math.random() * 100);
            
            if(random > 90) {

                elems.push({x:Math.floor(Math.random() * canvas.width - 100) , y:Math.floor(Math.random() * canvas.height - 100) , widht:10 , height:10 , color:'white' , deltax:0 , deltay:0});
            }


            if(keys['w']) {

                if(Math.abs(deltay - deltastepabs) < maxDelta) {
                    deltay -= deltastepabs ;
                }
            } 
            else if (keys['s'] !== true ) {
                
                deltay /= deltaDemph ;

            }
            
            if(keys['s']) {

                    deltay += deltastepabs ;
                }
            }
            else if (keys['w'] !== true ) {

            } 

            if(keys['a']) {

                }
            } 
            else if (keys['d'] !== true ) {

            } 
            
            if(keys['d']) {

                    deltax += deltastepabs ;
                }
            } 
            else if (keys['a'] !== true ) {
                
                deltax /= deltaDemph ;

            } 

            deltay += athmosphere.y ;
            

            // console.log({deltax , deltay});

            ctx.fillStyle = '#59798c' ;
            ctx.fillRect(0 , 0 , canvas.width , canvas.height);

            pos.x += deltax ;
            pos.y += (pos.y + deltay >= (canvas.height - 100)) ? 0 : deltay ;

            ctx.fillStyle = "#463148";
            ctx.fillRect(pos.x , pos.y , 100 , 100);


            const toDelete = [

            ]

            for (let i=0 ; i<elems.length ; i++) {

                elems[i].deltay += athmosphere.y ;

                elems[i].x += elems[i].deltax ;
                // elem.y += (elem.y + elem.deltay >= (canvas.height - 100)) ? 0 : elem.deltay ;
                elems[i].y += elems[i].deltay ;

                ctx.fillStyle = elems[i].color;
                ctx.fillRect(elems[i].x , elems[i].y , elems[i].widht , elems[i].height);

                if(elems[i].y > 500) {

                    toDelete.push(elems[i]);
                    elems.splice(i , 1);
                    
                }

</script>
