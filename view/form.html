<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="wrapper--main">
        <div>
            <form action="/api/handle-form" method="post" enctype="multipart/form-data">
                <input type="file" name="" id="" accept=".mp4, .mkv">
                <input placeholder="title" type="text" name="title" id="">
                <input placeholder="description" type="text" name="description" id="">
                <div>
                    <label for="opt-1">opiton 1</label>
                    <input type="checkbox" name="opt-1" id="opt-1">
                </div>
                <div>
                    <label for="opt-2">opiton 2</label>
                    <input type="checkbox" name="opt-2" id="opt-2">
                </div>
                <div>
                    <label for="opt-3">opiton 3.1</label>
                    <input type="radio" name="opt-3" id="opt-3.1">
                </div>
                <div>
                    <label for="opt-4">opiton 3.2</label>
                    <input type="radio" name="opt-3" id="opt-3.2">
                </div>
                <input type="submit" name="" id="" value="submit">
            </form>
        </div>
    </div>
</body>
</html>
