<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="wrapper--main">
        <form action="/api/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="data.file-1" id="data.file-1">
            <input type="file" name="data.file-2" id="data.file-2">
            <input type="file" name="data.file-3" id="data.file-3">
            <input type="text" name="attr.file-1" id="attr.file-1">
            <input type="text" name="attr.file-2" id="attr.file-2">
            <input type="text" name="attr.file-3" id="attr.file-3">
            <input type="radio" name="attr.file-1" id="attr.file.1.1" value="open">
            <input type="radio" name="attr.file-1" id="attr.file.1.2" value="closed" checked>
            <input type="submit" value="submit">
        </form>
    </div>
</body>
</html>
