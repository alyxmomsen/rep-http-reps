<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/api/"></script>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .wrapper--main {
            margin: 0 auto;
            padding: 9px ;
            width: 999px;
            height: 100vh;
        }

        .wrapper {
            border: 1px solid black ;
            border-radius: 9px;
            padding: 9px;
        }

        .flex-item {
            margin:9px;
        }

        .flex-container {
            display: flex ;
            gap: 9px;
            flex-wrap: wrap;
        }

        .flex-col {
            flex-direction: column;
        }

    </style>
    <title>Document</title>
</head>
<body>
    <div class="wrapper--main">
        <form action="/api/handle-form" method="post" enctype="multipart/form-data">
            <div class="wrapper flex-container flex-col">
                <div class="wrapper flex-container">
                    <div class="wrapper">
                        <label for="video-1">video 1</label>
                        <input type="file" name="file.video-1.--" id="video-1" accept=".mp4, .mkv">
                    </div>
                    <div class="wrapper">
                        <label for="picture-1">picture 1</label>
                        <input type="file" name="file.picture-1.--" id="picture-1" accept=".img, .gif, .png">
                    </div>
                    <div class="wrapper">
                        <label for="audio-1">audio 1</label>
                        <input type="file" name="file.audio-1.--" id="audio-1" accept=".mp3">
                    </div>
                </div>
                <div class="wrapper flex-item flex-container">
                    <input type="text" name="caption.cap-1.title--video-1" id="cap-1" placeholder="video-1 title">
                    <input type="text" name="caption.cap-2.description--video-1" id="cap-2" placeholder="video-1 description">
                    <input type="text" name="caption.cap-3.title--audio-1" id="cap-3" placeholder="audio-1 title">
                    <input type="text" name="caption.cap-4.description--audio-1" id="cap-4" placeholder="audio-1 description">
                    <input type="text" name="caption.cap-5.title--picture-1" id="cap-5" placeholder="picture-1 title">
                    <input type="text" name="caption.cap-6.description--picture-1" id="cap-6" placeholder="picture-1 description">
                </div>
                <div class="wrapper flex-item">
                    <label for="opt-0">foo bar</label>
                    <input type="checkbox" name="option.opt-0.hd--audio-1" value="yes" id="opt-0">
                    <label for="opt-1">foo bar</label>
                    <input type="checkbox" name="option.opt-1.short--audio-1" value="yes" id="opt-1">
                    <label for="opt-2">foo bar</label>
                    <input type="checkbox" name="option.opt-2.online--audio-1" value="yes" id="opt-2">
                </div>
                <div class="wrapper flex-item">
                    <label for="opt-3.1">foo bar</label>
                    <input type="radio" name="option.opt-3.stereo--audio-1" value="on" id="opt-3.1">
                    <label for="opt-3.2">foo bar</label>
                    <input type="radio" name="option.opt-3.stereo--audio-1" value="off" id="opt-3.2">
                </div>
                <div class="wrapper flex-item">
                    <label for="opt-4.1">foo bar</label>
                    <input type="radio" name="option.opt-4.disapearance-after--picture-1" value="1000" value id="opt-4.1">
                    <label for="opt-4.2">foo bar</label>
                    <input type="radio" name="option.opt-4.disapearance-after--picture-1" value="10000" id="opt-4.2">
                    <label for="opt-4.3">foo bar</label>
                    <input type="radio" name="option.opt-4.disapearance-after--picture-1" value="100000" id="opt-4.3">
                </div>
                <input type="submit" value="submit">
            </div>
        </form>
    </div>
</body>
</html>
