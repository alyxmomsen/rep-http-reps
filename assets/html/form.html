    <!-- структура!

        структура "name"
        <group-id> <table-name> <column-name> <data-type (инпуты отдают "стринг", но для БД нужен тип данных)>
        group-id: группа это одна строка в таблице БД
        table-name: целевая таблица в БД
        column-name: одна колонка строки группы
        
        отельное внимание на "column-name" для файла:

        колумн-нэйм файла будет использоваться как префих для названия колонки в БД
        так как для файла требуется по-меньшей мере три колонки, -
        "MIME" , "original-filename" , "filesystem-filename" , следовательно в БД будет:
        "<columnName>/MIME" , "<columnName>/original-filename" , "<columnName>/filesystem-filename" 

    -->
    <form action="/api/handle-form" method="post" enctype="multipart/form-data">
        <div>
            <input type="text" name="G11.users.name.string" id="">
            <input type="text" name="G11.users.last-name.string" id="">
            <input type="file" name="G11.users.avatar.binary" id="" accept=".img, .jpeg, .png">
            <input type="file" name="G11.users.thumb-nail.binary" id="" accept=".img, .jpeg, .png">
            <input type="file" name="G11.users.logo.binary" id="" accept=".img, .jpeg, .png">
        </div>
        <div>

            <input type="file" name="G21.playlist-1.video-min.binary" id="" accept=".mkv, .mp4">
            <input type="file" name="G21.playlist-1.video-mid.binary" id="">
            <input type="file" name="G21.playlist-1.video-fulhd.binary" id="">
        </div>
        <div>
            <input type="text" name="G22.playlist-1.title.string" id="">
            <input type="text" name="G22.playlist-1.description.string" id="">
            <input type="file" name="G22.playlist-1.video-min.binary" id="" accept=".mkv, .mp4">
            <input type="file" name="G22.playlist-1.video-mid.binary" id="">
            <input type="file" name="G22.playlist-1.video-fulhd.binary" id="">
        </div>
