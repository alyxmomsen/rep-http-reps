<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/css/main">
    <link rel="stylesheet" href="/public/css/form">
    <script src="/public/js/main"></script>
    <script src="/public/js/form"></script>
    <!-- <script src=""></script> -->
    <title>Document</title>
</head>
<body>
    <!-- <form action="/api/handle-form" method="post" enctype="text/plain"> -->
    <!-- <form action="/api/handle-form" method="post" enctype="application/x-www-form-urlencoded"> -->
    
    <!-- структура!

        структура "name"
        <group-id> <table-name> <column-name> <data-type (инпуты отдают "стринг", но для БД нужен тип данных)>
        group-id: группа это одна строка в таблице БД
        table-name: целевая таблица в БД
        column-name: одна колонка строки группы
        
        отельное внимание на "column-name" для файла:

        колумн-нэйм файла будет использоваться как префих для названия колонки в БД
        так как для файла требуется по-меньшей мере три колонки, -
        "MIME" , "original-filename" , "filesystem-filename" , следовательно в БД будет:
        "<columnName>/MIME" , "<columnName>/original-filename" , "<columnName>/filesystem-filename" 

    -->
    <div class="wrapper--main">
        <div class="wrapper form--main" id="">
            <form action="/api/handle-form" method="post" enctype="multipart/form-data" id="form--main">
                <div class="flex flex--col flex--gap-2">
                    <div class="flex flex--col flex--jtf-ctr flex--align-start flex--gap-1 form-element">
                        <h3>user</h3>
                        <input type="text" name="G11.users.name.string" id="">
                        <input type="text" name="G11.users.last-name.string" id="">
                        <input type="file" name="G11.users.avatar.binary" id="" accept=".img, .jpeg, .png">
                        <input type="file" name="G11.users.thumb-nail.binary" id="" accept=".img, .jpeg, .png">
                        <input type="file" name="G11.users.logo.binary" id="" accept=".img, .jpeg, .png">
                    </div>
                    <div>
                        <button type="button" id="button--add-element">ADD ELEMENT</button>
                    </div>
                    <div class="flex flex--col flex--jtf-ctr flex--align-start flex--gap-1 form-element">
                        <h3>playlist element</h3>
                        <input type="text" name="G21.playlist-1.title.string" id="">
                        <input type="text" name="G21.playlist-1.description.string" id="">
                        <input type="file" name="G21.playlist-1.video-min.binary" id="" accept=".mkv, .mp4">
                    </div>
                    <div class="flex flex--col flex--jtf-ctr flex--align-start flex--gap-1 form-element">
                        <h3>playlist element</h3>
                        <input type="text" name="G22.playlist-1.title.string" id="">
                        <input type="text" name="G22.playlist-1.description.string" id="">
                        <input type="file" name="G22.playlist-1.video-min.binary" id="" accept=".mkv, .mp4">
                    </div>
                    <div class="flex flex--gap-1">
                        <input type="submit" value="submit">
                        <input type="reset" value="reset">
                        <div id="status--upload">
                            status
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div id="modal-window--main">
            <div class="tool-tip--in-modal">
                <h3>modal window</h3>
                <div>will closed after 3 sec</div>
            </div>
        </div>
    </div>
</body>
</html>
