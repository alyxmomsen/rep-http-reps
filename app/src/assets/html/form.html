<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/css/main">
    <link rel="stylesheet" href="/public/css/form">
    <link rel="stylesheet" href="/public/css/flex">
    <script src="/public/javascript/main"></script>
    <script src="/public/javascript/form"></script>
    <title>Document</title>
</head>
<body>
    <div class="wrapper--main">
        <div class="menu--main">
            <a href="/form">form</a>
            <a href="/video-stream">video-stream</a>
        </div>
        <div>
            <!-- <form action="" method="post" enctype="multipart/form-data"> -->
            <!-- <form action="" method="post" enctype="multipart/form-data"> -->
            <form id="form--main" action="" method="post" enctype="multipart/form-data" class="flex flex--col flex-gap--2">
                <div class="flex wrapper--form-group">
                    <h3>user</h3>
                    <div class="flex flex-gap--2">
                        <input type="text" name="group-1.user.name" id="group-1.user.name">
                        <label for="group-1.user.name">name</label>
                    </div>
                    <div class="flex flex-gap--2">
                        <input type="text" name="group-1.user.lastname" id="group-1.user.lastname">
                        <label for="group-1.user.lastname">last name</label>
                    </div>
                </div>
                <div class="flex wrapper--form-group">
                    <h3>video #1</h3>
                    <div class="flex flex-gap--2">
                        <input type="text" name="group-2.file.description" id="group-2.file.description">
                        <label for="group-2.file.description">description</label>
                    </div>
                    <div class="flex flex-gap--2">
                        <input type="text" name="group-2.file.title" id="group-2.file.title">
                        <label for="group-2.file.title">title</label>
                    </div>
                    <div class="flex flex-gap--2">
                        <input type="text" name="group-4.user.lastname" id="group-4.user.lastname">
                        <label for="group-4.user.lastname">another-user lastname</label>
                    </div>
                    <div class="flex flex-gap--2">
                        <input type="file" name="group-2.file.*" id="group-2.file.*" accept=".mp4 , .mkv">
                        <label for="group-2.file.*">file</label>
                    </div>                    
                </div>
                <div class="flex wrapper--form-group">
                    <h3>video #2</h3>
                    <div class="flex flex-gap--2">
                        <input type="text" name="group-3.file.description" id="group-3.file.description">
                        <label for="group-3.file.description">description</label>
                    </div>
                    <div class="flex flex-gap--2">
                        <input type="text" name="group-3.file.title" id="group-3.file.title">
                        <label for="group-3.file.title">title</label>
                    </div>
                    <div class="flex flex-gap--2">
                        <input type="file" name="group-3.file.*" id="group-3.file.*" accept=".mp4 , .mkv">
                        <label for="group-3.file.*">file</label>
                    </div>
                    <div class="flex flex-gap--2">
                        <input type="text" name="group-4.user.name" id="group-4.user.name">
                        <label for="group-4.user.name">another-user name</label>
                    </div>
                </div>
                <div class="flex"></div>
                <div class="flex flex-gap--2">
                    <div>
                        <input type="submit" value="submit">
                    </div>
                    <div>
                        <input type="reset" value="reset">
                    </div>
                    <div class="flex flex-gap--2">
                        <div id="status--upload">status 1</div>
                        <div>status 2</div>
                    </div>
                </div>
            </form>
        </div>
        <div class="">

        </div>
    </div>    
</body>
</html>
